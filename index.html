<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>숫자를 찾아라! - 두근두근 수학 나라</title>
<style>
  :root{
    --pink:#FFD3E0;
    --pink-deep:#FF9EB8;
    --peach:#FFE3C2;
    --sky:#CFEFFF;
    --mint:#CFF6E4;
    --lavender:#E6DEFF;
    --sun:#FFF3B0;
    --text:#5B4B7A;
    --text-soft:#8578A8;
    --accent:#FF7FA6;
    --accent-2:#7EC8E3;
    --white:#FFFFFF;
    --shadow: 0 8px 0 rgba(91,75,122,0.15);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    font-family:'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--text);
    background:linear-gradient(160deg,var(--sky) 0%,var(--mint) 45%,var(--lavender) 100%);
    overflow:hidden;
    touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
  }
  button{ font-family:inherit; cursor:pointer; }
  #app{ position:relative; width:100vw; height:100vh; height:100dvh; overflow:hidden; }

  .screen{ display:none; width:100%; height:100%; flex-direction:column; align-items:center; position:relative; }
  .screen.active{ display:flex; }

  /* ---------- decorative background blobs ---------- */
  .bg-deco{ position:absolute; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
  .bg-deco span{ position:absolute; border-radius:50%; opacity:0.55; filter:blur(1px); }
  .bg-deco span:nth-child(1){ width:140px; height:140px; background:var(--pink); top:-30px; left:-30px; }
  .bg-deco span:nth-child(2){ width:90px; height:90px; background:var(--sun); top:10%; right:8%; }
  .bg-deco span:nth-child(3){ width:60px; height:60px; background:var(--accent-2); bottom:12%; left:6%; }
  .bg-deco span:nth-child(4){ width:120px; height:120px; background:var(--lavender); bottom:-40px; right:-20px; }

  /* ---------- LOBBY ---------- */
  #screen-lobby{ padding:5vh 5vw; justify-content:flex-start; }
  .lobby-header{ text-align:center; margin-top:2vh; z-index:1; }
  .lobby-header h1{ font-size:clamp(28px,6vw,44px); margin:0; color:var(--accent); text-shadow:2px 3px 0 rgba(255,255,255,0.7); }
  .lobby-header p{ margin:8px 0 0; font-size:clamp(14px,2.4vw,18px); color:var(--text-soft); }

  .game-grid{
    z-index:1; margin-top:4vh; display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:clamp(14px,3vw,28px);
    width:min(920px,92vw);
  }
  .game-card{
    border:none; border-radius:28px; padding:clamp(16px,3vw,26px) 10px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    background:var(--white); box-shadow:var(--shadow);
    transform:translateY(0); transition:transform .15s ease, box-shadow .15s ease;
    aspect-ratio:1/1;
  }
  .game-card.main-card{ background:linear-gradient(160deg,#FFF0F5,#FFFFFF); }
  .game-card:not(.locked):active{ transform:translateY(6px); box-shadow:0 2px 0 rgba(91,75,122,0.15); }
  .game-card .card-icon{ font-size:clamp(34px,7vw,56px); }
  .game-card h2{ margin:0; font-size:clamp(14px,2.6vw,20px); color:var(--text); }
  .game-card p{ margin:0; font-size:clamp(11px,1.8vw,13px); color:var(--text-soft); text-align:center; }
  .game-card.locked{ opacity:0.55; }
  .game-card.locked h2{ font-size:clamp(12px,2vw,15px); }

  /* ---------- BACK BUTTON ---------- */
  .back-btn{
    position:absolute; top:18px; left:18px; z-index:10;
    background:var(--white); border:none; border-radius:20px; padding:10px 18px;
    font-size:15px; font-weight:700; color:var(--accent); box-shadow:var(--shadow);
  }
  .back-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 rgba(91,75,122,0.15); }

  /* ---------- DIFFICULTY ---------- */
  #screen-difficulty{ justify-content:center; align-items:center; gap:4vh; }
  #screen-difficulty h2{ z-index:1; font-size:clamp(22px,4vw,32px); color:var(--accent); margin:0; }
  .diff-grid{ z-index:1; display:flex; gap:clamp(14px,3vw,26px); flex-wrap:wrap; justify-content:center; width:min(760px,92vw); }
  .diff-card{
    border:none; border-radius:26px; width:min(210px,28vw); min-width:150px; padding:22px 14px;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    background:var(--white); box-shadow:var(--shadow); transition:transform .15s ease;
  }
  .diff-card:active{ transform:translateY(6px); box-shadow:0 2px 0 rgba(91,75,122,0.15); }
  .diff-card .diff-emoji{ font-size:clamp(30px,5vw,44px); }
  .diff-card b{ font-size:clamp(16px,2.6vw,20px); color:var(--text); }
  .diff-card small{ font-size:clamp(11px,1.8vw,12.5px); color:var(--text-soft); text-align:center; line-height:1.4; }
  .diff-card.easy{ background:linear-gradient(160deg,#FFF9E0,#fff); }
  .diff-card.normal{ background:linear-gradient(160deg,#E4FFF3,#fff); }
  .diff-card.hard{ background:linear-gradient(160deg,#F0E9FF,#fff); }
  .diff-card.lvl9{ background:linear-gradient(160deg,#FFE9E9,#fff); }
  .diff-card.lvl8{ background:linear-gradient(160deg,#FFF3DC,#fff); }
  .diff-card.lvl7{ background:linear-gradient(160deg,#E8F0FF,#fff); }
  .diff-card .diff-hanja{ font-size:clamp(30px,5vw,44px); font-weight:800; color:var(--accent); }
  .diff-card.eng1{ background:linear-gradient(160deg,#FFEFE0,#fff); }
  .diff-card.eng2{ background:linear-gradient(160deg,#E4F7FF,#fff); }
  .diff-card.eng3{ background:linear-gradient(160deg,#E9FFEA,#fff); }
  .diff-card.eng4{ background:linear-gradient(160deg,#F3E9FF,#fff); }

  /* ---------- GAME ---------- */
  #screen-game{ justify-content:flex-start; }
  .game-topbar{
    z-index:6; width:100%; display:flex; align-items:center; justify-content:center;
    padding:14px 0 6px; position:relative;
  }
  .stage-indicator{ font-weight:800; font-size:clamp(14px,2.4vw,18px); color:var(--text); background:var(--white); padding:8px 18px; border-radius:18px; box-shadow:var(--shadow); }
  .progress-dots{ position:absolute; bottom:-14px; left:50%; transform:translateX(-50%); display:flex; gap:5px; z-index:5; }
  .progress-dots span{ width:8px; height:8px; border-radius:50%; background:rgba(91,75,122,0.2); }
  .progress-dots span.done{ background:var(--accent); }
  .progress-dots span.current{ background:var(--accent-2); transform:scale(1.3); }

  .equation-banner{
    position:relative;
    z-index:5; margin:20px auto 4px; padding:20px 36px; background:var(--white); border-radius:26px;
    font-size:clamp(48px,10.8vw,80px); font-weight:800; color:var(--text); box-shadow:var(--shadow);
    letter-spacing:2px; text-align:center;
  }
  .equation-banner.hanja-char{ font-size:clamp(96px,22vw,180px); padding:8px 44px; letter-spacing:0; }
  .banner-speak{
    display:none; position:absolute; top:-14px; right:-14px; z-index:6;
    width:44px; height:44px; border-radius:50%; border:none; background:var(--accent-2);
    color:#fff; font-size:20px; box-shadow:0 4px 0 rgba(91,75,122,0.2); align-items:center; justify-content:center;
  }
  .banner-speak.show{ display:flex; }
  .banner-speak:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(91,75,122,0.2); }
  .banner-speak.speaking{ animation:speakPulse .5s ease-in-out infinite; }
  @keyframes speakPulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.15); } }
  .feedback-msg{ z-index:5; min-height:22px; font-size:clamp(12px,2vw,15px); color:var(--accent); font-weight:700; margin-bottom:4px; }

  .stage-wrap{
    position:relative; flex:1; width:100%; overflow:hidden;
  }
  .sky-deco{ position:absolute; top:4%; left:0; width:100%; z-index:0; display:flex; justify-content:space-between; padding:0 6%; pointer-events:none; }
  .cloud{ width:clamp(50px,8vw,80px); height:clamp(24px,4vw,40px); background:#fff; border-radius:40px; opacity:0.85; position:relative; }
  .cloud::before,.cloud::after{ content:''; position:absolute; background:#fff; border-radius:50%; }
  .cloud::before{ width:55%; height:130%; top:-50%; left:8%; }
  .cloud::after{ width:45%; height:100%; top:-35%; right:10%; }
  .cloud.c2{ margin-top:26px; opacity:0.6; }

  .ground{ position:absolute; bottom:0; left:0; width:100%; height:14%; background:linear-gradient(180deg,#BFF0C9,#9FE0AE); border-radius:50% 50% 0 0/30px 30px 0 0; z-index:0; }

  .doors-row{
    position:absolute; bottom:12%; left:50%; transform:translateX(-50%);
    display:flex; gap:clamp(10px,3.2vw,60px); z-index:2; perspective:1300px;
    width:min(880px,96vw); justify-content:center;
  }
  .door-slot{ display:flex; flex-direction:column; align-items:center; gap:10px; width:clamp(105px,27vw,225px); }
  .nameplate{
    position:relative;
    background:#FFF3D6; border:3px solid #E8C97A; border-radius:14px; padding:6px 20px;
    font-weight:800; font-size:clamp(27px,5.4vw,42px); color:#8A6A1F; box-shadow:0 3px 0 rgba(0,0,0,0.08);
    white-space:nowrap;
  }
  .nameplate.small-text{ font-size:clamp(20px,4vw,27px); padding:6px 15px; }
  .plate-speak{
    display:none; position:absolute; top:-12px; right:-12px; z-index:6;
    width:30px; height:30px; border-radius:50%; border:none; background:var(--accent-2);
    color:#fff; font-size:14px; box-shadow:0 3px 0 rgba(91,75,122,0.2); align-items:center; justify-content:center;
  }
  .plate-speak.show{ display:flex; }
  .plate-speak:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(91,75,122,0.2); }
  .plate-speak.speaking{ animation:speakPulse .5s ease-in-out infinite; }
  .door-btn{ border:none; background:none; padding:0; width:100%; }
  .door-frame{
    position:relative; width:100%; aspect-ratio:3/5; background:#C99A6B; border-radius:14px 14px 4px 4px;
    box-shadow:inset 0 0 0 6px #A9784C, 0 8px 0 rgba(91,75,122,0.15);
    overflow:hidden; transform-style:preserve-3d;
  }
  .door-slot:nth-child(1) .door-frame{ background:#E8A6B8; box-shadow:inset 0 0 0 6px #D480A0,0 8px 0 rgba(91,75,122,0.15); }
  .door-slot:nth-child(2) .door-frame{ background:#8FCBE0; box-shadow:inset 0 0 0 6px #63AECB,0 8px 0 rgba(91,75,122,0.15); }
  .door-slot:nth-child(3) .door-frame{ background:#B7A6E8; box-shadow:inset 0 0 0 6px #9483D4,0 8px 0 rgba(91,75,122,0.15); }

  .door-inside{ position:absolute; inset:6px; background:#3B2A22; border-radius:10px; }
  .door-light{ position:absolute; inset:6px; background:radial-gradient(circle,#fff 0%,#fff 60%,rgba(255,255,255,0) 100%); opacity:0; border-radius:10px; transform:scale(0.15); transform-origin:50% 55%; }
  .door-slot.correct-open .door-light{ animation:doorGlowSpread .8s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes doorGlowSpread{
    0%{ opacity:0; transform:scale(0.15); }
    35%{ opacity:1; transform:scale(0.7); box-shadow:0 0 20px 6px rgba(255,255,255,0.7); }
    100%{ opacity:1; transform:scale(1.25); box-shadow:0 0 50px 22px rgba(255,255,255,0.95); }
  }

  .monster-pop{ position:absolute; bottom:0; left:50%; width:70%; transform:translate(-50%,30px) scale(0.4); opacity:0; z-index:3; }
  .door-slot.wrong .monster-pop{ animation:monsterAttackSequence 1.1s ease-in-out forwards; }
  @keyframes monsterAttackSequence{
    0%{ transform:translate(-50%,30px) scale(0.3); opacity:0; }
    25%{ transform:translate(-50%,0) scale(1); opacity:1; }
    45%{ transform:translate(-50%,-18px) scale(1.15); opacity:1; }
    62%{ transform:translate(-50%,-16px) scale(1.12); opacity:1; }
    100%{ transform:translate(-50%,32px) scale(0.25); opacity:0; }
  }

  .door-panel{
    position:absolute; inset:6px; background:linear-gradient(160deg,#D9A566,#B87F44);
    border-radius:8px; transform-origin:left center; transition:transform .5s ease; z-index:4;
    box-shadow:inset 0 0 0 3px rgba(0,0,0,0.08);
  }
  .door-panel::after{ content:''; position:absolute; top:50%; right:10%; width:10px; height:10px; background:#F5D98A; border-radius:50%; transform:translateY(-50%); box-shadow:0 0 0 2px rgba(0,0,0,0.1); }
  .door-panel .panel-line{ position:absolute; left:14%; right:14%; top:12%; bottom:12%; border:2px solid rgba(0,0,0,0.08); border-radius:6px; }
  .door-slot.correct-open .door-panel{ transform:rotateY(-112deg); }
  .door-slot.wrong .door-panel{ transform:rotateY(-78deg); }

  .stage-wrap.shake{ animation:screenShake .45s; }
  @keyframes screenShake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-8px); }
    40%{ transform:translateX(7px); }
    60%{ transform:translateX(-5px); }
    80%{ transform:translateX(4px); }
  }

  .child-wrap{
    position:absolute; left:50%; bottom:6%; width:clamp(90px,16.5vw,144px); z-index:3;
    transform-origin:50% 100%;
    transform:translate(-50%,0) scale(1);
    transition:transform .35s ease;
  }
  .child-wrap.hit{ animation:childShake .45s ease; }
  @keyframes childShake{
    0%,100%{ transform:translate(-50%,0) rotate(0deg); }
    20%{ transform:translate(-58%,2px) rotate(-7deg); }
    40%{ transform:translate(-42%,-2px) rotate(7deg); }
    60%{ transform:translate(-58%,2px) rotate(-5deg); }
    80%{ transform:translate(-42%,-2px) rotate(5deg); }
  }
  .child-wrap.walk-approach{
    transition:transform .55s cubic-bezier(.45,.05,.4,1);
    transform:translate(calc(-50% + var(--dx1,0px)), var(--dy1,0px)) scale(1);
  }
  .child-wrap.walk-approach svg{ animation:walkBob .3s ease-in-out infinite; }
  @keyframes walkBob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
  .child-wrap.walk-enter{
    transition:transform .5s cubic-bezier(.4,0,.7,1), opacity .4s ease .2s;
    transform:translate(calc(-50% + var(--dx2,0px)), var(--dy2,0px)) scale(0.2);
    opacity:0;
  }
  .child-wrap svg, .monster-pop svg, .reunion-stage svg{ width:100%; height:100%; display:block; }

  .child-wrap:not(.walk-approach):not(.walk-enter) svg{ animation:idleBob 1.8s ease-in-out infinite; }
  @keyframes idleBob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-3px); } }

  /* back-view child (door game) limb pivots */
  .b-leg-a{ transform-origin:37.5px 84px; }
  .b-leg-b{ transform-origin:62.5px 84px; }
  .b-arm-a{ transform-origin:19px 56px; }
  .b-arm-b{ transform-origin:81px 56px; }
  .walk-approach .b-leg-a{ animation:legSwingA .32s ease-in-out infinite; }
  .walk-approach .b-leg-b{ animation:legSwingB .32s ease-in-out infinite; }
  .walk-approach .b-arm-a{ animation:armSwingA .32s ease-in-out infinite; }
  .walk-approach .b-arm-b{ animation:armSwingWave .32s ease-in-out infinite; }

  /* front-running child (poop game / ending run-in) limb pivots */
  .r-leg-a{ transform-origin:40.5px 90px; transform:rotate(18deg); }
  .r-leg-b{ transform-origin:57.5px 90px; transform:rotate(-24deg); }
  .r-arm-a{ transform-origin:28px 56px; transform:rotate(20deg); }
  .wave-arm{ transform-origin:72px 60px; }
  .running .r-leg-a, #poop-player .r-leg-a{ animation:legSwingA .32s ease-in-out infinite; }
  .running .r-leg-b, #poop-player .r-leg-b{ animation:legSwingB .32s ease-in-out infinite; }
  .running .r-arm-a, #poop-player .r-arm-a{ animation:armSwingA .32s ease-in-out infinite; }
  .running .wave-arm, #poop-player .wave-arm{ animation:armSwingWave2 .32s ease-in-out infinite; }

  @keyframes legSwingA{ 0%,100%{ transform:rotate(32deg); } 50%{ transform:rotate(-28deg); } }
  @keyframes legSwingB{ 0%,100%{ transform:rotate(-28deg); } 50%{ transform:rotate(32deg); } }
  @keyframes armSwingA{ 0%,100%{ transform:rotate(36deg); } 50%{ transform:rotate(-24deg); } }
  @keyframes armSwingWave{ 0%,100%{ transform:rotate(-26deg); } 50%{ transform:rotate(30deg); } }
  @keyframes armSwingWave2{ 0%,100%{ transform:rotate(-14deg); } 50%{ transform:rotate(14deg); } }

  .fade-overlay{
    position:absolute; inset:0; background:#2E2440; opacity:0; pointer-events:none;
    transition:opacity .45s ease; z-index:20;
  }
  .fade-overlay.active{ opacity:1; }

  /* ---------- ENDING ---------- */
  #screen-ending{ justify-content:center; align-items:center; }
  .ending-content{ z-index:2; text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; height:100%; justify-content:center; }
  .reunion-stage{ position:relative; width:min(420px,80vw); height:clamp(160px,28vh,240px); margin-bottom:6px; }
  .reunion-glow{
    position:absolute; left:50%; bottom:8%; width:70%; height:70%; transform:translateX(-50%);
    background:radial-gradient(circle,rgba(255,255,255,0.9) 0%,rgba(255,241,176,0.5) 45%,rgba(255,241,176,0) 75%);
    opacity:0; transition:opacity 1s ease; pointer-events:none;
  }
  .reunion-stage.arrived .reunion-glow{ opacity:1; }
  .toilet{ position:absolute; left:50%; bottom:6%; width:32%; transform:translateX(-50%); }
  .child-reunion{
    position:absolute; left:-6%; bottom:6%; width:20%;
    transition:left 1.3s cubic-bezier(.3,.65,.35,1), bottom .5s ease, width .5s ease;
  }
  .reunion-stage.hug .child-reunion{ left:50%; }
  .child-reunion.running svg{ animation:runBob .32s ease-in-out infinite; }
  @keyframes runBob{ 0%,100%{ transform:translateY(0) rotate(0deg); } 50%{ transform:translateY(-9px) rotate(-4deg); } }
  .child-reunion.seated{ bottom:17%; width:19%; }
  .child-reunion.seated svg{ animation:seatedIdle 1.4s ease-in-out infinite; }
  @keyframes seatedIdle{ 0%,100%{ transform:scale(1) translateY(0); } 50%{ transform:scale(1.03) translateY(-2px); } }

  .ending-content h2, .ending-content p, .ending-content button{
    opacity:0; transform:translateY(12px);
    transition:opacity .6s ease, transform .6s ease;
  }
  .ending-content.reveal h2, .ending-content.reveal p, .ending-content.reveal button{
    opacity:1; transform:translateY(0);
  }
  .ending-content.reveal p{ transition-delay:.1s; }
  .ending-content.reveal button{ transition-delay:.2s; }
  .ending-content h2{ font-size:clamp(24px,5vw,36px); color:var(--accent); margin:4px 0 0; }
  .ending-content p{ font-size:clamp(13px,2.4vw,17px); color:var(--text-soft); margin:0 0 10px; }
  #ending-home-btn{
    border:none; border-radius:22px; padding:14px 34px; background:var(--accent); color:#fff;
    font-weight:800; font-size:clamp(14px,2.4vw,17px); box-shadow:0 6px 0 #D45C82;
  }
  #ending-home-btn:active{ transform:translateY(5px); box-shadow:0 1px 0 #D45C82; }

  .confetti-layer{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:10; }
  .confetti-piece{ position:absolute; top:-12px; border-radius:2px; animation:confettiFall linear forwards; }
  @keyframes confettiFall{
    0%{ transform:translateY(-10vh) rotate(0deg); opacity:1; }
    100%{ transform:translateY(108vh) rotate(360deg); opacity:0.9; }
  }

  /* ---------- POOP DODGE MINIGAME ---------- */
  #screen-poop{ justify-content:flex-start; }
  .poop-topbar{ z-index:6; width:100%; display:flex; align-items:center; justify-content:center; padding:14px 0 6px; position:relative; }
  .poop-score{ font-weight:800; font-size:clamp(14px,2.4vw,18px); color:var(--text); background:var(--white); padding:8px 18px; border-radius:18px; box-shadow:var(--shadow); }
  .poop-stage{ position:relative; flex:1; width:100%; overflow:hidden; touch-action:none; cursor:pointer; }
  .poop-intro{
    position:absolute; top:6%; left:50%; transform:translateX(-50%);
    background:var(--white); padding:10px 22px; border-radius:20px; box-shadow:var(--shadow);
    font-weight:800; font-size:clamp(14px,2.6vw,20px); color:var(--accent); z-index:9;
    opacity:0; transition:opacity .4s ease; pointer-events:none; white-space:nowrap;
  }
  .poop-intro.show{ opacity:1; }
  .poop-player{
    position:absolute; bottom:6%; width:clamp(60px,11vw,96px); z-index:3;
    transform:translateX(-50%);
  }
  .poop-player svg{ width:100%; height:100%; display:block; }
  .poop-player.hit{ animation:poopHit .5s ease; }
  .poop-zone-hint{
    position:absolute; bottom:2%; width:50%; text-align:center;
    font-size:clamp(20px,4vw,30px); color:var(--text); opacity:0.18;
    pointer-events:none; z-index:1;
  }
  .poop-zone-hint.left{ left:0; }
  .poop-zone-hint.right{ right:0; }
  @keyframes poopHit{
    0%,100%{ filter:brightness(1) saturate(1); transform:translateX(-50%) rotate(0deg); }
    20%{ filter:brightness(1.4) saturate(1.6); transform:translateX(-58%) rotate(-8deg); }
    40%{ transform:translateX(-42%) rotate(8deg); }
    60%{ transform:translateX(-58%) rotate(-6deg); }
    80%{ transform:translateX(-42%) rotate(6deg); }
  }
  .poop-item{
    position:absolute; font-size:clamp(34px,7vw,56px); line-height:1;

  .poop-gameover{

  .poop-gameover-card p{ margin:6px 0 0; font-size:clamp(14px,2.4vw,18px); color:var(--text-soft); }

  @media (max-width:480px){
    .doors-row{ gap:8px; }
    .equation-banner{ padding:14px 20px; letter-spacing:1px; }

<body>
<div id="app">

  <!-- LOBBY -->
  <section class="screen active" id="screen-lobby">
    <div class="bg-deco"><span></span><span></span><span></span><span></span></div>

      <h1>🌈 두근두근 수학 나라</h1>
      <p>재미있는 게임으로 숫자와 친해져요!</p>
    </div>
    <div class="game-grid">
      <button class="game-card main-card" id="card-door-game">
        <div class="card-icon">🔢</div>
        <h2>숫자를 찾아라!</h2>
        <p>정답의 문을 찾아 떠나는 모험</p>
      </button>
      <button class="game-card main-card" id="card-hanja-game">
        <div class="card-icon">🈶</div>
        <h2>한자를 찾아라!</h2>
        <p>한자와 뜻을 맞혀요</p>
      </button>
      <button class="game-card main-card" id="card-english-game">
        <div class="card-icon">🔤</div>
        <h2>영어를 찾아라!</h2>
        <p>영단어와 뜻을 맞혀요</p>
      </button>
    </div>
  </section>

  <!-- DIFFICULTY -->
  <section class="screen" id="screen-difficulty">
    <div class="bg-deco"><span></span><span></span><span></span><span></span></div>
    <button class="back-btn" id="diff-back">← 돌아가기</button>
    <h2>난이도를 골라주세요</h2>
    <div class="diff-grid">
      <button class="diff-card easy" data-diff="easy">
        <span class="diff-emoji">🐣</span><b>초급</b>
        <small>한 자릿수<br>덧셈 · 뺄셈</small>
      </button>
      <button class="diff-card normal" data-diff="normal">
        <span class="diff-emoji">🐥</span><b>중급</b>
        <small>두 자릿수(10~20)<br>+ 한 자릿수</small>
      </button>
      <button class="diff-card hard" data-diff="hard">
        <span class="diff-emoji">🦉</span><b>상급</b>
        <small>두 자릿수 + 두 자릿수<br>(합 50 이하)</small>
      </button>
    </div>
  </section>

  <!-- HANJA DIFFICULTY -->
  <section class="screen" id="screen-difficulty-hanja">
    <div class="bg-deco"><span></span><span></span><span></span><span></span></div>
    <button class="back-btn" id="diff-hanja-back">← 돌아가기</button>
    <h2>급수를 골라주세요</h2>
    <div class="diff-grid">
      <button class="diff-card lvl9" data-level="9">
        <span class="diff-hanja">九</span><b>9급</b>
        <small>숫자 한자<br>一 二 三 ...</small>
      </button>
      <button class="diff-card lvl8" data-level="8">
        <span class="diff-hanja">八</span><b>8급</b>
        <small>자연 · 가족 한자<br>山 水 父 母 ...</small>
      </button>
      <button class="diff-card lvl7" data-level="7">
        <span class="diff-hanja">七</span><b>7급</b>
        <small>방향 · 몸 한자<br>東 西 手 足 ...</small>
      </button>
    </div>
  </section>

  <!-- ENGLISH DIFFICULTY -->
  <section class="screen" id="screen-difficulty-english">
    <div class="bg-deco"><span></span><span></span><span></span><span></span></div>
    <button class="back-btn" id="diff-english-back">← 돌아가기</button>
    <h2>레벨을 골라주세요</h2>

      <button class="diff-card eng1" data-level="1">
        <span class="diff-emoji">🍎</span><b>5~7세</b>
        <small>동물 · 색깔 · 숫자<br>cat, red, one ...</small>
      </button>
      <button class="diff-card eng2" data-level="2">
        <span class="diff-emoji">✏️</span><b>초1~2</b>
        <small>학교 · 가족 · 동작<br>school, run, big ...</small>
      </button>
      <button class="diff-card eng3" data-level="3">
        <span class="diff-emoji">📘</span><b>초3~4</b>
        <small>날씨 · 장소 · 계절<br>weather, city, fast ...</small>

    <button class="back-btn" id="game-back">← 나가기</button>

          </button>
        </div>

          <div class="nameplate"><span class="plate-number">2</span><button class="plate-speak" data-index="1" aria-label="발음 듣기">🔊</button></div>
          <button class="door-btn" data-index="1">
            <div class="door-frame">
              <div class="door-inside"></div>
              <div class="door-light"></div>
              <div class="monster-pop" data-monster></div>
              <div class="door-panel"><div class="panel-line"></div></div>
            </div>
          </button>
        </div>
        <div class="door-slot" data-index="2">
          <div class="nameplate"><span class="plate-number">3</span><button class="plate-speak" data-index="2" aria-label="발음 듣기">🔊</button></div>
          <button class="door-btn" data-index="2">

      <button id="ending-home-btn">메인으로 돌아가기</button>
    </div>
    <div class="confetti-layer" id="confetti-layer"></div>

      <div class="ground"></div>

          <p id="poop-final-score">피한 똥: 0개</p>
        </div>
      </div>
    </div>
  </section>

</div>

  document.getElementById('card-door-game').addEventListener('click', function(){ showScreen('difficulty'); });

  function updateDots(){
    var dots = dotsWrap.children;
    for(var i=0;i<dots.length;i++){
      dots[i].classList.toggle('done', i < state.stage);
      dots[i].classList.toggle('current', i === state.stage);
    }
  }

  var state = { gameType:'math', difficulty:'easy', hanjaLevel:'9', englishLevel:'1', opSequence:null, stage:0, totalStages:10, used:null, current:null, locked:false };

  function pick(min,max){ return Math.floor(Math.random()*(max-min+1)) + min; }

  function buildOpSequence(){

    for(var i=seq.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = seq[i]; seq[i] = seq[j]; seq[j] = t;
    }
    return seq;
  }

  function generateFact(difficulty){
    var guard = 0;
    var op = state.opSequence[state.stage];
    while(guard < 500){
      guard++;
      var A, B;
      if(difficulty === 'easy'){
        A = pick(1,9); B = pick(1,9);
        if(op === '-' && A < B){ var t=A; A=B; B=t; }
      } else if(difficulty === 'normal'){
        var two = pick(10,20), one = pick(1,9);
        if(op === '-'){ A = two; B = one; }
        else { if(Math.random() < 0.5){ A = two; B = one; } else { A = one; B = two; } }
      } else { // hard
        if(op === '+'){
          A = pick(10,40);
          var maxB = Math.min(40, 50-A);
          if(maxB < 10) continue;
          B = pick(10, maxB);
        } else {
          A = pick(15,49);
          B = pick(10, A);
        }
      }
      var result = op === '+' ? A+B : A-B;
      if(A === 0 || B === 0 || result === 0) continue;
      var key = A + op + B;
      if(state.used.has(key)) continue;
      state.used.add(key);
      return { A:A, B:B, op:op, result:result };
    }
    // zero-free fallback (should not normally happen)
    return { A:2, B:1, op:op, result: op === '+' ? 3 : 1 };
  }

  function buildProblem(difficulty){
    var fact = generateFact(difficulty);
    var slot = pick(0,2); // 0=A hidden, 1=B hidden, 2=result hidden
    var answer, dispA, dispB, dispR;
    if(slot === 0){ answer = fact.A; dispA = '⬜'; dispB = fact.B; dispR = fact.result; }
    else if(slot === 1){ answer = fact.B; dispA = fact.A; dispB = '⬜'; dispR = fact.result; }
    else { answer = fact.result; dispA = fact.A; dispB = fact.B; dispR = '⬜'; }
    var text = dispA + ' ' + fact.op + ' ' + dispB + ' = ' + dispR;
    return { fact:fact, slot:slot, answer:answer, text:text };
  }

  function buildCandidates(answer){
    var set = {}; set[answer] = true;
    var list = [answer];
    var guard = 0;
    while(list.length < 3 && guard < 300){
      guard++;
      var delta = pick(1,3) * (Math.random() < 0.5 ? -1 : 1);
      var val = answer + delta;
      if(val < 0 || set[val]) continue;
      set[val] = true; list.push(val);
    }
    guard = 0;
    while(list.length < 3 && guard < 300){
      guard++;
      var val2 = pick(0, answer + 5);
      if(set[val2]) continue;
      set[val2] = true; list.push(val2);
    }
    // shuffle
    for(var i=list.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp = list[i]; list[i] = list[j]; list[j] = tmp;
    }
    return list;
  }

  function buildEnglishProblem(level){
    var pool = ENGLISH_POOL[level];
    var entry, guard = 0;
    do {
      entry = pool[pick(0, pool.length - 1)];
      guard++;
    } while(state.used.has('en' + level + ':' + entry.en) && guard < 200);
    state.used.add('en' + level + ':' + entry.en);

    var questionType = Math.random() < 0.5 ? 'word' : 'meaning';
    var promptText, answer;
    if(questionType === 'word'){
      promptText = entry.ko;
      answer = entry.en;
    } else {
      promptText = entry.en;
      answer = entry.ko;
    }
    return { entry:entry, questionType:questionType, promptText:promptText, answer:answer };
  }

  function buildEnglishCandidates(level, correctEntry, questionType){
    var pool = ENGLISH_POOL[level];
    var sameCat = pool.filter(function(e){ return e.cat === correctEntry.cat && e.en !== correctEntry.en; });
    var others = pool.filter(function(e){ return e.en !== correctEntry.en; });
    var source = sameCat.length >= 2 ? sameCat : others;

    var shuffled = source.slice();
    for(var i=shuffled.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = t;
    }
    var picks = [correctEntry].concat(shuffled.slice(0,2));
    var texts = picks.map(function(e){
      return questionType === 'word' ? e.en : e.ko;
    });
    for(var k=texts.length-1;k>0;k--){
      var j2 = Math.floor(Math.random()*(k+1));
      var t2 = texts[k]; texts[k] = texts[j2]; texts[j2] = t2;
    }
    return texts;
  }

  function speakEnglish(text, btn){
    if(!('speechSynthesis' in window) || !text) return;
    window.speechSynthesis.cancel();
    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = 0.85;
    if(btn){
      btn.classList.add('speaking');
      utter.onend = function(){ btn.classList.remove('speaking'); };
      utter.onerror = function(){ btn.classList.remove('speaking'); };
    }
    window.speechSynthesis.speak(utter);
  }

      speakEnglish(word, btn);
    });
  });

  function startGame(gameType, level){
    state.gameType = gameType;
    state.stage = 0;
    state.used = new Set();
    state.locked = false;
    if(gameType === 'math'){
      state.difficulty = level;
      state.opSequence = buildOpSequence();
    } else if(gameType === 'english'){
      state.englishLevel = level;
    } else {
      state.hanjaLevel = level;
    }
    showScreen('game');
    resetSceneForNextStage();
    renderStage();
  }

  function renderStage(){
    if('speechSynthesis' in window){ window.speechSynthesis.cancel(); }
    equationBanner.classList.remove('hanja-char');
    bannerSpeakBtn.classList.remove('show','speaking');
    doorSlots.forEach(function(slot){ slot.querySelector('.nameplate').classList.remove('small-text'); });
    plateSpeakBtns.forEach(function(btn){ btn.classList.remove('show','speaking'); });

    var promptText, answer, candidates;
    if(state.gameType === 'hanja'){
      var hp = buildHanjaProblem(state.hanjaLevel);
      promptText = hp.promptText;
      answer = hp.answer;
      candidates = buildHanjaCandidates(state.hanjaLevel, hp.entry, hp.questionType);
      if(hp.questionType === 'reading'){ equationBanner.classList.add('hanja-char'); }
    } else if(state.gameType === 'english'){
      var ep = buildEnglishProblem(state.englishLevel);
      promptText = ep.promptText;
      answer = ep.answer;
      candidates = buildEnglishCandidates(state.englishLevel, ep.entry, ep.questionType);
      if(ep.questionType === 'meaning'){
        bannerSpeakBtn.classList.add('show');
      } else {
        plateSpeakBtns.forEach(function(btn){ btn.classList.add('show'); });
      }
    } else {
      var problem = buildProblem(state.difficulty);
      promptText = problem.text;
      answer = String(problem.answer);
      candidates = buildCandidates(problem.answer).map(String);
    }

    state.current = { answer: String(answer) };
    bannerTextEl.textContent = promptText;
    feedbackMsg.textContent = '';
    stageNumEl.textContent = state.stage + 1;
    updateDots();

    candidates.forEach(function(val, i){
      doorSlots[i].querySelector('.plate-number').textContent = val;
      if(val.indexOf(' ') !== -1){ doorSlots[i].querySelector('.nameplate').classList.add('small-text'); }
      doorSlots[i].dataset.value = val;
    });
    state.locked = false;
  }

    doorSlots.forEach(function(slot){
      slot.classList.remove('correct-open','wrong');

  function selectDoor(idx){
    if(state.locked) return;
    var slot = doorSlots[idx];
    var val = slot.dataset.value;
    if(val === state.current.answer){
      state.locked = true;
      feedbackMsg.textContent = '';
      playCorrect(idx);
    } else {
      playWrong(idx);
    }
  }

  function playWrong(idx){
    var slot = doorSlots[idx];
    state.locked = true;
    slot.classList.add('wrong');
    feedbackMsg.textContent = '다시 한번 생각해볼까요? 🙂';

    setTimeout(function(){
      stageWrap.classList.add('shake');
      childWrap.classList.add('hit');
    }, 480);
    setTimeout(function(){
      stageWrap.classList.remove('shake');
      childWrap.classList.remove('hit');
    }, 930);
    setTimeout(function(){
      slot.classList.remove('wrong');
      resetSceneForNextStage();
      renderStage();
    }, 1150);
  }

  function playCorrect(idx){
    var slot = doorSlots[idx];
    slot.classList.add('correct-open');

    var doorRect = slot.getBoundingClientRect();
    var childRect = childWrap.getBoundingClientRect();
    var childAnchorX = childRect.left + childRect.width/2;
    var childAnchorY = childRect.bottom;
    var doorCenterX = doorRect.left + doorRect.width/2;
    var thresholdY = doorRect.top + doorRect.height*0.88;
    var deeperY = doorRect.top + doorRect.height*0.48;

    childWrap.style.setProperty('--dx1', (doorCenterX - childAnchorX) + 'px');
    childWrap.style.setProperty('--dy1', (thresholdY - childAnchorY) + 'px');
    childWrap.style.setProperty('--dx2', (doorCenterX - childAnchorX) + 'px');
    childWrap.style.setProperty('--dy2', (deeperY - childAnchorY) + 'px');

    var APPROACH_DELAY = 300, APPROACH_DUR = 550, ENTER_DUR = 500, FADE_DUR = 450;

    setTimeout(function(){
      childWrap.classList.add('walk-approach');
    }, APPROACH_DELAY);

    setTimeout(function(){
      childWrap.classList.remove('walk-approach');
      childWrap.classList.add('walk-enter');
    }, APPROACH_DELAY + APPROACH_DUR);

    setTimeout(function(){
      fadeOverlay.classList.add('active');
    }, APPROACH_DELAY + APPROACH_DUR + ENTER_DUR);

    setTimeout(function(){
      advanceStage();
    }, APPROACH_DELAY + APPROACH_DUR + ENTER_DUR + FADE_DUR);
  }

  function advanceStage(){
    state.stage++;
    if(state.stage >= state.totalStages){
      resetSceneForNextStage();
      startPoopGame();
      return;
    }
    resetSceneForNextStage();
    renderStage();
    requestAnimationFrame(function(){
      fadeOverlay.classList.remove('active');
    });
  }

    stageEl.classList.remove('hug','arrived');
    childEl.classList.remove('running','seated');
    childEl.innerHTML = childRunningSVG();
    contentEl.classList.remove('reveal');

    var RUN_DELAY = 400, RUN_DUR = 1300;

    setTimeout(function(){
      childEl.classList.add('running');
      stageEl.classList.add('hug');
    }, RUN_DELAY);

    setTimeout(function(){
      childEl.classList.remove('running');
      childEl.innerHTML = childSittingSVG();
      childEl.classList.add('seated');
      stageEl.classList.add('arrived');
      contentEl.classList.add('reveal');
      spawnConfetti();
    }, RUN_DELAY + RUN_DUR);
  }

  function spawnConfetti(){
    var layer = document.getElementById('confetti-layer');
    layer.innerHTML = '';
    var colors = ['#FF9EB8','#7EC8E3','#FFE38A','#B7A6E8','#9EE6C0'];
    for(var i=0;i<60;i++){
      var piece = document.createElement('div');
      piece.className = 'confetti-piece';
      var size = 6 + Math.random()*6;
      piece.style.width = size + 'px';
      piece.style.height = (size*1.4) + 'px';
      piece.style.left = (Math.random()*100) + '%';
      piece.style.background = colors[Math.floor(Math.random()*colors.length)];
      piece.style.animationDuration = (2.2 + Math.random()*1.8) + 's';
      piece.style.animationDelay = (Math.random()*0.6) + 's';
      layer.appendChild(piece);
    }
  }

  /* ============ poop dodge minigame (post-clear breather, one round) ============ */
  document.getElementById('poop-player').innerHTML = childRunningSVG();
  document.getElementById('poop-back').addEventListener('click', function(){ stopPoopGame(); showEnding(); });

  var poopStage = document.getElementById('poop-stage');
  var poopPlayerEl = document.getElementById('poop-player');
  var poopScoreEl = document.getElementById('poop-score-num');
  var poopGameOverEl = document.getElementById('poop-gameover');
  var poopFinalScoreEl = document.getElementById('poop-final-score');
  var poopIntroEl = document.getElementById('poop-intro');

  var POOP_ACCEL = 60, POOP_MAX_SPEED = 78, POOP_FRICTION = 20;
  var poopActiveKey = null;

  var poopGame = {
    running:false, score:0, playerX:50, vx:0, accelDir:0, poops:[], rafId:null,
    spawnAcc:0, spawnInterval:1000, lastTime:0
  };

  function startPoopGame(){
    poopGame.running = true;
    poopGame.score = 0;
    poopGame.playerX = 50;
    poopGame.vx = 0;
    poopGame.accelDir = 0;
    poopGame.poops.forEach(function(p){ p.el.remove(); });
    poopGame.poops = [];
    poopGame.spawnAcc = 0;
    poopGame.spawnInterval = 1000;
    poopGame.lastTime = 0;
    poopScoreEl.textContent = '0';
    poopPlayerEl.style.left = '50%';
    poopPlayerEl.classList.remove('hit');
    poopGameOverEl.classList.remove('show');
    showScreen('poop');
    poopIntroEl.classList.add('show');
    setTimeout(function(){ poopIntroEl.classList.remove('show'); }, 1800);
    poopStage.addEventListener('pointerdown', onPoopPointerDown);
    poopStage.addEventListener('pointerup', onPoopPointerUp);
    poopStage.addEventListener('pointercancel', onPoopPointerUp);
    poopStage.addEventListener('pointerleave', onPoopPointerUp);
    window.addEventListener('keydown', onPoopKeyDown);
    window.addEventListener('keyup', onPoopKeyUp);
    poopGame.rafId = requestAnimationFrame(poopLoop);
  }

  function stopPoopGame(){
    poopGame.running = false;
    poopGame.accelDir = 0;
    poopActiveKey = null;
    if(poopGame.rafId){ cancelAnimationFrame(poopGame.rafId); poopGame.rafId = null; }
    poopStage.removeEventListener('pointerdown', onPoopPointerDown);
    poopStage.removeEventListener('pointerup', onPoopPointerUp);
    poopStage.removeEventListener('pointercancel', onPoopPointerUp);
    poopStage.removeEventListener('pointerleave', onPoopPointerUp);
    window.removeEventListener('keydown', onPoopKeyDown);
    window.removeEventListener('keyup', onPoopKeyUp);
    poopGame.poops.forEach(function(p){ p.el.remove(); });
    poopGame.poops = [];
  }

  function onPoopPointerDown(e){
    if(!poopGame.running) return;
    var rect = poopStage.getBoundingClientRect();
    var pct = ((e.clientX - rect.left) / rect.width) * 100;
    poopGame.accelDir = pct < 50 ? -1 : 1;
  }

  function onPoopPointerUp(){
    poopGame.accelDir = 0;
  }

  function onPoopKeyDown(e){
    if(!poopGame.running) return;
    if(e.key === 'ArrowLeft'){ poopGame.accelDir = -1; poopActiveKey = 'ArrowLeft'; }
    else if(e.key === 'ArrowRight'){ poopGame.accelDir = 1; poopActiveKey = 'ArrowRight'; }
  }

  function onPoopKeyUp(e){
    if((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && poopActiveKey === e.key){
      poopGame.accelDir = 0;
      poopActiveKey = null;
    }
  }

  function spawnPoop(){
    var el = document.createElement('div');
    el.className = 'poop-item';
    el.textContent = '💩';
    poopStage.appendChild(el);
    var x = pick(6, 94);
    var speed = 20 + Math.random()*10;
    el.style.left = x + '%';
    el.style.top = '-5%';
    poopGame.poops.push({ el:el, x:x, y:-5, speed:speed });
  }

  function shrinkRect(r, wf, hf){
    var w = r.width * wf, h = r.height * hf;
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    return { left: cx - w/2, right: cx + w/2, top: cy - h/2, bottom: cy + h/2 };
  }

  function rectsOverlap(a, b){
    return !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom);
  }

  function poopLoop(ts){
    if(!poopGame.running) return;
    if(!poopGame.lastTime) poopGame.lastTime = ts;
    var dt = (ts - poopGame.lastTime) / 1000;
    poopGame.lastTime = ts;

    poopGame.spawnAcc += dt * 1000;
    if(poopGame.spawnAcc >= poopGame.spawnInterval){
      poopGame.spawnAcc = 0;
      spawnPoop();
      poopGame.spawnInterval = Math.max(320, poopGame.spawnInterval - 12);
    }

    if(poopGame.accelDir !== 0){
      poopGame.vx += poopGame.accelDir * POOP_ACCEL * dt;
      poopGame.vx = Math.max(-POOP_MAX_SPEED, Math.min(POOP_MAX_SPEED, poopGame.vx));
    } else if(poopGame.vx > 0){
      poopGame.vx = Math.max(0, poopGame.vx - POOP_FRICTION * dt);
    } else if(poopGame.vx < 0){
      poopGame.vx = Math.min(0, poopGame.vx + POOP_FRICTION * dt);
    }
    poopGame.playerX = Math.max(8, Math.min(92, poopGame.playerX + poopGame.vx * dt));
    poopPlayerEl.style.left = poopGame.playerX + '%';
    var playerHitRect = shrinkRect(poopPlayerEl.getBoundingClientRect(), 0.5, 0.55);

    var speedMul = Math.min(2.2, 1 + poopGame.score * 0.025);
    for(var i = poopGame.poops.length - 1; i >= 0; i--){
      var p = poopGame.poops[i];
      p.y += p.speed * speedMul * dt;
      p.el.style.top = p.y + '%';

      if(p.y >= 60){
        var poopHitRect = shrinkRect(p.el.getBoundingClientRect(), 0.55, 0.55);
        if(rectsOverlap(playerHitRect, poopHitRect)){
          hitPoopPlayer();
          return;
        }
      }
      if(p.y > 105){
        p.el.remove();
        poopGame.poops.splice(i, 1);
        poopGame.score++;
        poopScoreEl.textContent = poopGame.score;
      }
    }

    poopGame.rafId = requestAnimationFrame(poopLoop);
  }

  function hitPoopPlayer(){
    poopGame.running = false;
    poopGame.accelDir = 0;
    poopActiveKey = null;
    if(poopGame.rafId){ cancelAnimationFrame(poopGame.rafId); poopGame.rafId = null; }
    poopStage.removeEventListener('pointerdown', onPoopPointerDown);
    poopStage.removeEventListener('pointerup', onPoopPointerUp);
    poopStage.removeEventListener('pointercancel', onPoopPointerUp);
    poopStage.removeEventListener('pointerleave', onPoopPointerUp);
    window.removeEventListener('keydown', onPoopKeyDown);
    window.removeEventListener('keyup', onPoopKeyUp);
    poopPlayerEl.classList.add('hit');
    poopFinalScoreEl.textContent = '피한 똥: ' + poopGame.score + '개';
    poopGameOverEl.classList.add('show');
    setTimeout(function(){
      poopGame.poops.forEach(function(p){ p.el.remove(); });
      poopGame.poops = [];
      showEnding();
    }, 1900);
  }

})();
</script>
</body>
</html>
